name: artdatabase-resourcespace-validation

services:
  resourcespace:
    build:
      context: .
      args:
        UBUNTU_MIRROR: "${UBUNTU_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports}"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - resourcespace_filestore:/var/www/html/filestore
      - ./runtime/config.php:/var/www/html/include/config.php
      - ./cronjob:/etc/cron.daily/resourcespace
      - ./upload.ini:/etc/php/8.3/apache2/conf.d/99-artdatabase-upload.ini:ro
    networks:
      - frontend
      - backend
    ports:
      - "${RS_PORT:-18080}:80"
    healthcheck:
      # Check a non-redirecting endpoint. The root page redirects to the
      # externally configured base URL, which is not reachable as localhost
      # from inside the container.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - resourcespace_mariadb:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  frontend:
  backend:

volumes:
  resourcespace_mariadb:
  resourcespace_filestore:
